# ScrapTrader — nginx site config
#
# Install to /etc/nginx/sites-available/scraptrader, symlink into
# sites-enabled, then run certbot (see deploy/README.md).
#
# This file closes ARCHITECTURE gap #22. Three jobs: terminate TLS,
# OVERWRITE X-Forwarded-For, and cap request bodies.

# Rate-limit zone for the public buyer/supplier surface. The app has its
# own in-process limiter, but that's per-process memory — this is the layer
# that survives a restart and costs nothing to evaluate.
limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name thescraptrader.com www.thescraptrader.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thescraptrader.com www.thescraptrader.com;

    # Filled in by certbot --nginx.
    ssl_certificate     /etc/letsencrypt/live/thescraptrader.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thescraptrader.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. Deliberately NOT preloaded and no includeSubDomains yet —
    # both are hard to undo, and this domain also carries Google Workspace
    # mail records. Revisit once the setup is settled.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # --- Body size caps --------------------------------------------------
    # The hard backstop behind lib/body-limit.ts, which can only inspect a
    # Content-Length header the client controls. Default is small; the
    # image route is the sole exception.
    client_max_body_size 1m;

    # --- Uploads ---------------------------------------------------------
    # Served straight off disk, bypassing Node entirely. The path is
    # OUTSIDE the deploy directory so a release can never wipe deal photos.
    #
    # nosniff matters here specifically: logos are stored AS RECEIVED (only
    # deal photos are re-encoded), so a file that sniffs as HTML must not
    # be served as HTML.
    location /uploads/ {
        alias /var/scraptrader/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        # Filenames are UUIDs and content never changes under a given name.
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Next.js build assets — content-hashed, safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Public buyer/supplier surface -----------------------------------
    # Tokenized links. Rate limited at the edge as well as in-process.
    location ~ ^/(api/public|deal|portal|prices)/ {
        limit_req zone=public burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/scraptrader-proxy.conf;
    }

    # Deal photo uploads: the one route that needs a large body.
    location /api/deals/ {
        client_max_body_size 12m;
        include /etc/nginx/snippets/scraptrader-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/scraptrader-proxy.conf;
    }
}
