# Shared proxy settings — install to
# /etc/nginx/snippets/scraptrader-proxy.conf
#
# ⚠ THE CRITICAL LINE IS X-Forwarded-For BELOW.
#
# lib/rate-limit.ts derives the client IP from that header. If nginx
# APPENDS to a client-supplied value (the usual $proxy_add_x_forwarded_for
# idiom), an attacker sets their own X-Forwarded-For and gets a fresh
# rate-limit bucket per request — every per-IP limit on the public buyer
# and supplier routes becomes decorative.
#
# $remote_addr OVERWRITES it with the real peer address. This is
# ARCHITECTURE gap #22(a), and it only works because nginx is the outermost
# hop. If you ever put Cloudflare in front, switch to CF-Connecting-IP and
# set real_ip_header accordingly — otherwise you'll be rate-limiting
# Cloudflare's edge IPs.

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Upgrade support (not used today; harmless and avoids a surprise later).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $http_connection_upgrade;

# Publishing to a large group sends email synchronously and can take a
# while — don't cut it off mid-send.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering off;
